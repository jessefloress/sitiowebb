
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Conversor de temperaturas</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0b1020;
            color: #e8eaff;
        }

        /* ENCABEZADO */
        header {
            width: 100%;
            height: 180px;
            overflow: hidden;
            background-color: #11182e;
            border-bottom: 2px solid #6c4ab6;
        }

        header img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }

        /* MENÚ */
        nav {
            background-color: #11162a;
            border-bottom: 1px solid #4b3a78;
            box-shadow: 0 2px 10px rgba(100, 70, 180, 0.25);
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        nav > ul {
            display: flex;
        }

        nav li {
            position: relative;
        }

        nav a {
            display: block;
            color: #dcdcff;
            text-decoration: none;
            padding: 15px 20px;
            transition: 0.3s;
        }

        nav a:hover {
            background-color: #29204a;
            color: #8fffe0;
        }

        nav li ul {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #171d35;
            min-width: 180px;
            z-index: 1000;
            border: 1px solid #59428f;
        }

        nav li:hover > ul {
            display: block;
        }

        nav li ul li {
            width: 100%;
        }

        nav li ul a {
            padding: 12px 15px;
        }

        /* CONTENIDO */
        main {
            min-height: 450px;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CONVERSOR */
        .conversor {
            width: 380px;
            max-width: 100%;
            padding: 30px;
            background-color: #11182d;
            border: 1px solid #59428f;
            border-radius: 10px;

            box-shadow:
                0 0 15px rgba(108, 74, 182, 0.25);

            text-align: center;
            box-sizing: border-box;
        }

        .conversor h1 {
            color: #9b7de8;
            margin-bottom: 10px;
        }

        .conversor p {
            color: #8fffe0;
            margin-bottom: 25px;
        }

        .conversor input,
        .conversor select {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            box-sizing: border-box;

            background-color: #0b1020;
            color: #e8eaff;

            border: 1px solid #59428f;
            border-radius: 6px;

            font-size: 15px;
            outline: none;
        }

        .conversor input:focus,
        .conversor select:focus {
            border-color: #8fffe0;
            box-shadow: 0 0 8px rgba(143, 255, 224, 0.2);
        }

        .conversor button {
            width: 100%;
            padding: 13px;

            background-color: #39275f;
            color: #8fffe0;

            border: 1px solid #6c4ab6;
            border-radius: 6px;

            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .conversor button:hover {
            background-color: #4b3278;
            color: white;
            box-shadow: 0 0 10px rgba(143, 255, 224, 0.3);
        }

        /* RESULTADO */
        #resultado {
            margin-top: 25px;
            padding: 15px;

            background-color: #0f1728;
            border: 1px solid #385b68;
            border-radius: 6px;

            color: #8fffe0;
            font-size: 19px;
            font-weight: bold;

            min-height: 25px;
        }

        /* PIE DE PÁGINA */
        footer {
            background-color: #0d1325;
            color: #dcdcff;
            display: flex;
            align-items: center;
            padding: 20px;
            border-top: 1px solid #4b3a78;
        }

        footer p {
            margin: 5px 0;
        }

        footer strong {
            color: #9b7de8;
        }

        footer p:last-child {
            color: #8fffe0;
        }

        /* ADAPTACIÓN A CELULARES */
        @media (max-width: 600px) {
            nav > ul {
                flex-wrap: wrap;
            }

            .conversor {
                width: 100%;
            }

            main {
                padding: 25px 15px;
            }
        }
    </style>
</head>

<body>

    <!-- ENCABEZADO -->
    <header>
        <!-- Puedes colocar aquí la misma imagen de tu sitio -->
    </header>

    <!-- MENÚ -->
    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>

            <li>
                <a href="#">Segunda parcial ▼</a>
                <ul>
                    <li>
                        <a href="temperaturas.html">
                            Conversor de temperaturas
                        </a>
                    </li>
                </ul>
            </li>
        </ul>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main>

        <div class="conversor">

            <h1>Conversor de temperaturas</h1>

            <p>Convierte Celsius y Fahrenheit fácilmente</p>

            <input
                type="number"
                id="temperatura"
                placeholder="Ingresa la temperatura"
                step="any"
            >

            <select id="conversion">
                <option value="celsius">
                    Celsius a Fahrenheit
                </option>

                <option value="fahrenheit">
                    Fahrenheit a Celsius
                </option>
            </select>

            <button onclick="convertir()">
                Convertir
            </button>

            <div id="resultado">
                Aquí aparecerá el resultado
            </div>

        </div>

    </main>

    <!-- PIE DE PÁGINA -->
    <footer>
        <div>
            <p><strong>Mi sitio web</strong></p>
            <p>Proyecto de Segunda Parcial</p>
            <p>Conversor de temperaturas</p>
        </div>
    </footer>

    <script src="temperaturas.js"></script>

</body>
</html>
